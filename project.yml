name: CameraDemo

options:
  deploymentTarget:
    iOS: "17.0"

targets:
  CameraDemo:
    type: application
    platform: iOS
    sources:
      - path: CameraDemo.swift
      - path: CameraDemoApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smalllion.camerademo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Select a video for the demo"

  VCam:
    type: library.dynamic
    platform: iOS
    sources:
      - path: Tweak
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
