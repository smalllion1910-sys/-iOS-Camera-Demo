name: Build Tweak Test

on:
  workflow_dispatch:
  push:
    branches: [livecontainer-tweak-test]

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Build ARM64 dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p output

          xcrun clang \
            -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=17.0 \
            -fobjc-arc \
            -framework Foundation \
            -x objective-c Tweak.xm \
            -o output/CameraDemo.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: CameraDemo-ARM64
          path: output/CameraDemo.dylib
