name: Build iOS Demo

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project CameraDemo.xcodeproj \
            -scheme CameraDemo \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: CameraDemo-iOS
          path: build/Build/Products/Debug-iphonesimulator/CameraDemo.app
